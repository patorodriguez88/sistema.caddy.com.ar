name: 🚀 Deploy to sandbox
on:
  push:
    branches:
      - develop   # 👈 Solo cuando haya push en develop
concurrency:
  group: deploy-sandbox
  cancel-in-progress: true
jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest
    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@v4
    
    - name: 📂 Sync files
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: dintersa.com.ar
        username: user@sandbox.sistema.caddy.com.ar
        password: ${{ secrets.SANDBOX_FTP_PASSWORD}}
        protocol: ftp
        port: 21
        log-level: verbose
        exclude: |
            **/.git*
            **/.github/**
            **/node_modules/**
            **/tests/**
            **/.env
            **/*.log
            **/*.zip
