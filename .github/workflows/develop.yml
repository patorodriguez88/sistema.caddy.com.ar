name: 🚀 Deploy website on push
on: 
  push:
    branches:
      - develop   # 👈 Solo cuando haya push en develop
jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest
    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@v4
    
    - name: 📂 Sync files
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: dintersa.com.ar
        username: user@sandbox.sistema.caddy.com.ar
        password: ${{ secrets.FTP_PASSWORD }}
