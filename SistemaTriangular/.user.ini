; Buffer de salida más grande: con el default (4096) muchas páginas ya mandan los
; headers reales antes de llegar al menú (topnav.html), y ahí session_start() falla
; de verdad (no es solo un warning). Con esto, PHP no manda nada hasta terminar la
; página (o superar este tamaño), así session_start() funciona en cualquier punto.
; .user.ini lo lee PHP directamente (no Apache) cuando corre como CGI/FastCGI --
; a diferencia de php_value en .htaccess, nunca puede tirar un 500 por sí solo.
output_buffering = 65536

; Toda fecha y hora que se graba es la de Córdoba, también en los scripts que no pasan por Conexioni.php.
date.timezone = "America/Argentina/Cordoba"
