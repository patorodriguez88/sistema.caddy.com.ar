; Defensa contra cruce de sesiones con plataforma.caddy.com.ar (mismo cPanel,
; ambos sitios usaban el PHPSESSID por default de PHP sin dominio/path
; explícito). Esto cubre CUALQUIER script de este sitio (incluido todo
; SistemaTriangular/), incluidos los que llaman session_start() directo sin
; pasar por SistemaTriangular/Conexion/Conexioni.php.
; Solo tiene efecto si PHP corre como FPM/CGI (no con mod_php - ahí .user.ini
; se ignora sin error). Puede tardar hasta session.ini_cache_ttl (5 min por
; default) en aplicarse tras subir este archivo.
session.name = "CADDY_SISTEMA_SESSID"
session.cookie_domain =
